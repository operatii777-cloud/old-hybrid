version: '3.9'

services:
  app:
    build: .
    container_name: horeca-ai
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SQLITE_PATH=/data/restaurant.db
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLOUD_ENABLED=${CLOUD_ENABLED:-false}
    volumes:
      - db-data:/data
      - logs-data:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:
  logs-data:
